<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form</title>
    <link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<script
src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script
src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        :root {
            --panel-bg: rgba(255, 255, 255, 0.78);
            --panel-border: rgba(255, 255, 255, 0.45);
            --accent: #0f766e;
            --accent-dark: #115e59;
            --text: #0f172a;
            --muted: #475569;
        }

        * {
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
            background:
                linear-gradient(135deg, rgba(15, 118, 110, 0.65), rgba(15, 23, 42, 0.4)),
                url("R12.jpeg") center/cover no-repeat fixed;
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        form{
            width: min(520px, 100%);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
        }

        fieldset{
            border: 0;
            padding: 0;
            margin: 0;
        }

        legend {
            font-weight: 700;
            margin-bottom: 18px;
            width: 100%;
            color: var(--accent-dark);
            text-align: center;
        }

        legend h1 {
            margin: 0;
            font-size: 1.9rem;
        }

        label{
            display: inline-block;
            margin: 6px 0 8px;
            font-style: normal;
            font-weight: 700;
            color: var(--muted);
        }

        input, textarea{
            margin-right: 5px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }
        input[type="text"],
        input[type="Rollno"],
        input[type="class"],
       textarea,
        input[type="date"]{
            min-height: 44px;
            padding: 10px 12px;
            border: 1.5px solid rgba(15, 118, 110, 0.25);
            border-radius: 12px;
            color: var(--text);
            outline: none;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
        }

        input:focus, textarea:focus {
            border-color: rgba(15, 118, 110, 0.8);
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
            transform: translateY(-1px);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .button-row{
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .button-row button {
            width: 120px;
            min-height: 44px;
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            box-shadow: 0 10px 20px rgba(15, 118, 110, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .button-row button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(15, 118, 110, 0.28);
        }

        .button-row button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        marquee{
            color: #ffffff;
            background: linear-gradient(90deg, rgba(15, 118, 110, 0.95), rgba(15, 23, 42, 0.88));
            width: 100%;
            margin-left: 0px;
            min-height: 42px;
            padding: 8px 12px;
            border-radius: 12px;
            font-style: italic;
            letter-spacing: 0.3px;
            margin-bottom: 18px;
            display: block;
        }
            
           
    </style>
</head>
<body>
   
    <form method ='put'>
        <h1>
      <marquee  direction="left"> Student Enrollment form </marquee></h1>
    
        <fieldset>
            <legend>
                <h1>Student  Information</h1>
            </legend>
             <label>Enter your Roll no. </label><br>
             <input type="rollno" id="stdrollno" name="pass"placeholder="xxxxxx" onchange="getRoll()" /> <br><br>
            <label for="">Enter your Full name</label><br>
            <input type="text" id="stdname" name="name"placeholder="user" /><br><br>

            <label for="class" >Enter your Class</label><br>
            <input type="class" id="stdclass" name="class"placeholder="x"/> <br><br>
            
           <label>Enter your Date Of Birth</label> <br>
             <input type="date" id="stddob"
                    name= "dob"/> <br><br>
             <label >Enter your Address</label> <br> 
             <textarea name="address" id="stdaddress" ></textarea> <br><br>
             
              <label>Enter your Enrollment Date</label> <br>
             <input type="date" id="stdenroll"
                    name= "enrolldate"/> <br><br>
                <div class="button-row">
                    <button type="button" id="save" onclick="saveData()" enabled>
                       Save </button> 
               <button type="button" id="change" onclick="changeData()" enabled>
                   Update </button> 
                   <button type="button" id="reset" onclick="resetForm()" enabled>
                    Reset </button> 
            </div>
                
            </fieldset>
          
    </form>
    <!-- MongoDB API Backend Integration -->
    <!-- Backend server should be running on http://localhost:3000 -->
 <script type="text/javascript" src="script.js"></script>
</body>
</html>
